<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="aurora" aria-hidden="true">
    <span class="blob blob--one"></span>
    <span class="blob blob--two"></span>
    <span class="blob blob--three"></span>
  </div>

  <main class="app">
    <header class="app__header">
      <h1 class="app__title">To-Do List|قائمة المهام</h1>
      <p class="app__subtitle" id="dateLine"></p>
    </header>

    <section class="card">

      <form class="add-form" id="addForm" autocomplete="off">
        <input
          type="text"
          id="taskInput"
          class="add-form__input"
          placeholder="أضف مهمة جديدة..."
          maxlength="120"
          required
        >
        <button type="submit" class="add-form__btn" aria-label="إضافة مهمة">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <div class="stats" id="stats">
        <div class="stats__progress-track">
          <div class="stats__progress-fill" id="progressFill"></div>
        </div>
        <div class="stats__row">
          <span id="statsText">لا توجد مهام بعد</span>
          <button class="clear-btn" id="clearBtn" type="button">مسح المكتملة</button>
        </div>
      </div>

      <div class="filters" id="filters">
        <button class="filter-btn is-active" data-filter="all" type="button">الكل</button>
        <button class="filter-btn" data-filter="active" type="button">قيد التنفيذ</button>
        <button class="filter-btn" data-filter="completed" type="button">مكتملة</button>
      </div>

      <ul class="task-list" id="taskList"></ul>

      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" width="46" height="46">
          <path d="M9 11l3 3L22 4M22 12v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2h10"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <p>يومك خالٍ من المهام. أضف أول مهمة لتبدأ!</p>
      </div>

    </section>

    <footer class="app__footer">
      <p>تُحفظ مهامك تلقائيًا على جهازك</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
